     Esta página se sirve desde el MISMO origen que la app, así que comparte su

     memoria que se descarta al cerrar la pestaña. -->
<script>
(function(){
  const mem = Object.create(null);
  const falso = {
    getItem(k){ return Object.prototype.hasOwnProperty.call(mem,k) ? mem[k] : null; },
    setItem(k,v){ mem[k] = String(v); },
    removeItem(k){ delete mem[k]; },
    clear(){ for(const k of Object.keys(mem)) delete mem[k]; },
    key(i){ return Object.keys(mem)[i] ?? null; },
    get length(){ return Object.keys(mem).length; }
  };
  // Se guarda el real para poder verificar al final que quedó intacto
  window.__localStorageReal = window.localStorage;
  window.__clavesRealesAlEmpezar = (function(){
    try { return Object.keys(window.localStorage).sort().join(","); } catch(e){ return "(inaccesible)"; }
  })();
  Object.defineProperty(window, "localStorage", { value: falso, configurable: true });

  // La app, al cargarse, toca elementos del DOM que esta página no tiene. Se devuelve un
  // elemento descartable en vez de null para que ese código de arranque no explote: acá
  // interesa probar la lógica, no la interfaz.
  const getRealId = document.getElementById.bind(document);
  document.getElementById = function(id){
    return getRealId(id) || document.createElement("div");
  };
})();
</script>

function igual(a, b, msg){
  const sa=JSON.stringify(a), sb=JSON.stringify(b);
  if(sa!==sb) throw new Error(`${msg||"valores distintos"}\n  esperado: ${sb}\n  obtenido: ${sa}`);
}
function cierto(v, msg){ if(!v) throw new Error(msg||"se esperaba algo verdadero"); }

// ── Datos de prueba ──
function movsDePrueba(n){
  const cats=["Supermercado","Transporte","Servicios","Salud","Ocio"];

    out.push({id:"m"+i, tipo:i%7===0?"Ingreso":"Gasto", importe:Math.round(Math.random()*500000)/100,

      nota:"Movimiento de prueba "+i+" con una nota de largo razonable", moneda:"ARS"});
  }
  return out;
}

test("escapeHtml neutraliza HTML inyectado", ()=>{
  const r=escapeHtml('<img src=x onerror="alert(1)">');
  cierto(!r.includes("<") && !r.includes(">"), "quedaron < o > sin escapar: "+r);
  cierto(r.includes("&lt;"), "no se escapó a &lt;");
});

test("escapeHtml tolera null y undefined", ()=>{

test("cifrar y descifrar devuelve los mismos datos", async ()=>{
  const clave=await deriveKey("1234", randomSaltB64());
  const original={fmovs3:JSON.stringify(movsDePrueba(5)), fcuentas:'["Galicia"]'};
  const descifrado=await decryptBlob(clave, await encryptBlob(clave, original));

// Este es EL test que faltaba: el bug que dejó al usuario sin poder entrar a la app era

// El escape viejo de los onclick solo cubría la comilla simple, pero el atributo va entre
// comillas DOBLES: un nombre de cuenta con " cerraba el atributo e inyectaba HTML.
test("attrJS neutraliza comillas dobles en los onclick", ()=>{
  const r=attrJS('Visa" onmouseover="alert(1)');
  cierto(!r.includes('"'), "quedó una comilla doble cruda: "+r);
  cierto(r.includes("&quot;"), "no se escapó a &quot;");
});

test("attrJS sobrevive a la ida y vuelta por el atributo", ()=>{
  // Se simula lo que hace el navegador: decodificar el atributo y evaluar el JS de adentro.
  // El "<\/script>" va con la barra escapada a propósito: escrito tal cual cerraría la
  // etiqueta <script> de esta misma página.
  for(const valor of ['Visa "Oro"', "O'Brien", 'a\\b', 'Ñandú & Cía', '<\/script>']){
    const enAtributo=attrJS(valor);
    const doc=new DOMParser().parseFromString(`<i data-x="${enAtributo}"></i>`,"text/html");
    const literalJS=doc.querySelector("i").getAttribute("data-x");
    igual(JSON.parse(literalJS), valor, `no volvió igual: ${valor}`);
  }
});

// Chequeo autoritativo: lo que importa no es si el TEXTO del atributo contiene "onmouseover"
// (puede ser parte del dato), sino si el navegador terminó creando un atributo de más.
test("un nombre hostil no agrega atributos al elemento", ()=>{
  const hostil='Banco " onmouseover="alert(1)';
  const html=`<div role="button" tabindex="0" onclick="showCuentaDetail(${attrJS(hostil)})"></div>`;
  const el=new DOMParser().parseFromString(html,"text/html").querySelector("div");
  igual(el.getAttributeNames().sort(), ["onclick","role","tabindex"], "apareció un atributo inyectado");
  // Y además el valor tiene que llegar entero a la función.
  const literal=el.getAttribute("onclick").replace(/^showCuentaDetail\(/,"").replace(/\)$/,"");
  igual(JSON.parse(literal), hostil, "el nombre no llegó intacto al handler");
});

// PLATA: QUÉ CUENTA COMO GASTO

grupo("Plata: gastos y ahorros");

const GASTO_NORMAL   = {tipo:"Gasto",    cat:"Comida", importe:200000};
const DEPOSITO       = {tipo:"Gasto",    cat:"Ahorro", importe:180000, esAhorro:true};
const COMPRA_CON_AHO = {tipo:"Gasto",    cat:"Comida", importe:300000, usaAhorro:true};
const SUELDO         = {tipo:"Ingreso",  cat:"Sueldo", importe:1000000};

test("cada movimiento se clasifica una sola vez", ()=>{
  cierto(esGasto(GASTO_NORMAL) && !esDepositoAhorro(GASTO_NORMAL) && !esRetiroAhorro(GASTO_NORMAL), "el gasto normal se clasificó mal");
  cierto(esGasto(DEPOSITO) && esDepositoAhorro(DEPOSITO), "un depósito al fondo sigue teniendo tipo Gasto");
  cierto(esGasto(COMPRA_CON_AHO) && esRetiroAhorro(COMPRA_CON_AHO), "una compra pagada con ahorros sigue siendo un gasto");
  cierto(!esGasto(SUELDO), "un ingreso no es un gasto");
  cierto(esIngreso(SUELDO), "el sueldo es un ingreso");
  // Sacar plata de tu propio fondo no te hace más rico: el balance mide cuánto creció tu
  // patrimonio, no cuánta plata tenés en la mano. Lo que baja el patrimonio es la compra que
  // pagaste con ese retiro, y eso ya está contado como gasto.
  cierto(!esIngreso(COMPRA_CON_AHO), "un retiro del fondo no puede contar como ingreso");
  cierto(!esIngreso(DEPOSITO) && !esIngreso(GASTO_NORMAL), "un gasto no puede contar como ingreso");
});

test("guardar plata no es gastarla", ()=>{
  const t=totalesDePlata([SUELDO, GASTO_NORMAL, DEPOSITO]);
  igual(t.gastos, 200000, "el depósito al fondo se coló en los gastos: esa plata sigue siendo tuya");
  igual(t.depositos, 180000, "pero tiene que seguir siendo visible como depósito");
  // Cobraste 1.000.000 y consumiste 200.000: creciste 800.000, estén donde estén (600.000 en la
  // cuenta y 180.000 en el fondo... más los 20.000 que quedaron dando vueltas).
  igual(t.balance, 800000, "guardar en el fondo no puede bajar el balance");
});

test("gastar plata del fondo sí es un gasto", ()=>{
  const t=totalesDePlata([SUELDO, GASTO_NORMAL, COMPRA_CON_AHO]);
  igual(t.gastos, 500000, "la compra pagada con ahorros tiene que estar en los gastos");
  igual(t.retiros, 300000, "el retiro tiene que reconocerse");
  // Antes el retiro sumaba 300.000 como ingreso y el balance daba 800.000, como si gastar del
  // fondo fuera gratis. Consumiste 500.000 de 1.000.000: creciste 500.000.
  igual(t.balance, 500000, "el retiro volvió a sumar como ingreso y tapó el gasto");
});

test("cada peso se cuenta una sola vez en la cadena completa", ()=>{
  // Guardás 180.000 y después sacás esos 180.000 para gastarlos: consumiste 180.000 en total,
  // no 0 ni 360.000. Lo que cambió respecto del modelo viejo es CUÁNDO se cuenta: antes pesaba
  // al guardar, ahora al gastar, que es cuando realmente dejás de tener la plata.
  const guardar=totalesDePlata([DEPOSITO]);
  const gastarDelFondo=totalesDePlata([{tipo:"Gasto", cat:"Comida", importe:180000, usaAhorro:true}]);
  igual(guardar.balance, 0, "guardar no cambia el patrimonio: la plata sigue siendo tuya");
  igual(gastarDelFondo.balance, -180000, "gastarla sí lo baja, y ahí se cuenta");
  igual(guardar.balance + gastarDelFondo.balance, -180000, "la cadena entera tiene que costar 180.000, una sola vez");
});

test("los depósitos y retiros siguen siendo distinguibles", ()=>{
  const t=totalesDePlata([SUELDO, GASTO_NORMAL, DEPOSITO, COMPRA_CON_AHO]);
  igual(t.depositos, 180000, "se perdió el desglose de lo ahorrado");
  igual(t.retiros, 300000, "se perdió el desglose de lo retirado");
  igual(t.gastos, 500000, "los gastos son el consumo + la compra con ahorros, sin el depósito");
  igual(t.balance, 1000000 - 500000, "el balance no cierra con sus propias partes");
});

// Los montos de inversión son de otra escala que el sueldo y el supermercado: mezclados en
// Ingresos y Gastos tapan la lectura de todos los días. Van aparte, un chip por ticker, y el
// Balance los vuelve a sumar porque el bolsillo sí los siente:
//     Balance = Ingresos − Gastos + Σ (neto de cada ticker)
const MES_INV = [
  {id:1, tipo:"Ingreso", cat:"Sueldo", importe:2000000, fecha:"2026-08-04", moneda:"ARS"},
  {id:2, tipo:"Gasto",   cat:"Supermercado", importe:500000, fecha:"2026-08-06", moneda:"ARS"},
  // BCAHA: entra más de lo que sale (rescataste) → neto +100.000
  {id:3, tipo:"Inversion", subcat:"FCI Suscripción",     ticker:"BCAHA", cat:"FCI", importe:900000,  fecha:"2026-08-10"},
  {id:4, tipo:"Inversion", subcat:"FCI Rescate capital", ticker:"BCAHA", cat:"FCI", importe:1000000, fecha:"2026-08-20"},
  // YPF: solo compraste → neto −300.000 (plata puesta, todavía sin rescatar)
  {id:5, tipo:"Inversion", subcat:"Acciones Compra",     ticker:"YPF",   cat:"Acciones", importe:300000, fecha:"2026-08-12"}
];

  igual(ypf.ars, -300000, "solo compraste: la plata está puesta ahí");
  igual(bcaha.movs, 2);
});

test("un número roto ni siquiera se toca", async ()=>{
  // Comparar el texto final no alcanza: fmtTotal(NaN) también devuelve "—", así que sacar el
  // guard daría el mismo resultado y el test pasaría igual (me pasó). Lo que distingue es que
  // el elemento no se ESCRIBA: sin el guard, animarNumero le pisa el textContent en cada cuadro.
  const cont=document.createElement("div");
  cont.innerHTML=`<div data-animar="">—</div><div data-animar="hola">—</div>`;

  try{
    animarNumerosDe(cont);

// Con el PIN activo los datos NO viven en localStorage: viven en encCache, y se leen con
// getSensitiveRaw(). Corre `fn` como si el PIN estuviera puesto y la app desbloqueada.
function conPinActivo(fn){
  const blobAntes=localStorage.getItem("fencblob");
  const cacheAntes=encCache;
  localStorage.setItem("fencblob", "x");   // con esto isEncActive() da true
  encCache={};
  try{ return fn(); }
  finally{
    if(blobAntes===null) localStorage.removeItem("fencblob"); else localStorage.setItem("fencblob", blobAntes);
    encCache=cacheAntes;
  }
}

// Comprar una inversión no es un gasto y venderla no es un ingreso: es la misma plata cambiando
// de lugar. Lo único que mueve tu patrimonio es el RESULTADO.
let _idInv=1000;
function compra(fecha, ticker, monto, extra){
  return Object.assign({id:++_idInv, tipo:"Inversion", subcat:"FCI Suscripción", ticker, fecha, importe:monto}, extra||{});
}
function venta(fecha, ticker, monto, extra){
  return Object.assign({id:++_idInv, tipo:"Inversion", subcat:"FCI Rescate capital", ticker, fecha, importe:monto}, extra||{});
}

  igual(r.gananciaPorMes["2026-04"].ars, 0, "el mes en que solo compraste no tiene ganancia");

// La solapa Tarjetas quedó con dos cards: Balance del mes y Cuotas pendientes, en ese orden,
// y nada después. Las secciones "Activas" y "Completados" (una card por compra cargada) se
// sacaron a pedido por ser un desglose redundante; editar o borrar una compra con tarjeta se
// hace desde Movimientos. Se prueba mirando el HTML y el CÓDIGO FUENTE, no el DOM: en
// tests.html document.getElementById() devuelve un <div> descartable nuevo en cada llamada,
// así que leer de vuelta lo que renderTarjetas() escribió no es confiable.
// La opción 1c "Línea de tiempo" (ver handoff de Tarjetas) sacó las dos cards con card-title
// fijo: ahora el orden es línea de tiempo → Balance del mes → Compras de este mes, cada uno
// un contenedor que JS llena entero (sin título estático en el HTML).
test("la solapa de Tarjetas tiene línea de tiempo, balance y compras del mes, en ese orden", async ()=>{
  const html=await (await fetch("index.html")).text();
  const ini=html.indexOf('id="page-tc"');
  const fin=html.indexOf('id="page-', ini+5);
  cierto(ini>=0 && fin>ini, "no se encontró la solapa de tarjetas en index.html");
  const solapa=html.slice(ini,fin);
  cierto(!solapa.includes("month-nav"), "la franja .month-nav vieja tiene que haber desaparecido (el header ahora es el de Movimientos)");
  cierto(!solapa.includes("card-title"), "ya no hay card-title fijo: Balance del mes y Compras de este mes los dibuja JS");
  const orden=["tc-timeline","tc-balance","tc-pendientes"].map(id=>solapa.indexOf(`id="${id}"`));
  cierto(orden.every(i=>i>=0), "faltó alguno de los contenedores: línea de tiempo, balance o compras del mes");
  cierto(orden[0]<orden[1] && orden[1]<orden[2], "el orden tiene que ser línea de tiempo, balance, compras del mes");
});

// Corre fn con estas compras en cuotas cargadas, y después deja tcs como estaba.
function conTarjetas(lista, fn){
  const antes=tcs;
  tcs=lista;
  try { return fn(); } finally { tcs=antes; }
}

// ── POR CATEGORÍA EN TARJETAS ──
// "Por tarjeta" dice con qué plástico pagaste; no dice en qué se te fue la plata. El desglose
// por categoría del mes vive en la card "Balance del mes", antes del Detalle — después de
// Cuotas pendientes no va nada.
// Hace falta DOM de verdad: el harness devuelve un <div> descartable para los ids que no
// existen, así que leer de vuelta lo que renderTarjetas() escribió no funcionaría.
function balanceTcDelMes(lista, ym, vista="tarjeta"){
  const ids=["tc-mes-label","tc-balance","tc-pendientes"];
  const creados=ids.map(id=>{ const d=document.createElement("div"); d.id=id; document.body.appendChild(d); return d; });
  const mesAntes=mesTc, vistaAntes=tcVistaBarras;
  mesTc=ym; tcVistaBarras=vista;
  try { return conTarjetas(lista, ()=>{ renderTarjetas(); return creados[1].innerHTML; }); }
  finally { creados.forEach(e=>e.remove()); mesTc=mesAntes; tcVistaBarras=vistaAntes; }
}

// ── LA CARD MUESTRA EL MES SELECCIONADO, NO UNA PROYECCIÓN FUTURA ──
// Antes "Cuotas pendientes" proyectaba los meses SIGUIENTES (una caja por mes, tocar para
// desglosar): esa navegación ahora vive en la línea de tiempo (#tc-timeline). Esta card
// muestra las compras del mes mirado y, debajo, una línea de cierre con lo que queda DESPUÉS
// de él (mesesConCuotasPendientes sigue siendo inclusiva del mes que se le pasa, sin cambios).

// Corre renderTcPendientes() de verdad y devuelve el HTML que escribió. Hace falta crear el
// contenedor real: el getElementById parcheado de esta página devuelve un <div> descartable
// distinto en cada llamada, así que si no existe #tc-pendientes no hay forma de leer lo dibujado.
function htmlDePendientes(lista, ym){
  const cont=document.createElement("div");
  cont.id="tc-pendientes";
  cont.style.display="none";
  document.body.appendChild(cont);
  const antesTcs=tcs, antesMes=mesTc;
  try{
    tcs=lista; mesTc=ym;
    renderTcPendientes();
    return cont.innerHTML;
  } finally {
    tcs=antesTcs; mesTc=antesMes;
    cont.remove();
  }
}

// Arma N meses con un gasto de `monto` cada uno, terminando en el mes anterior a `hastaYM`.
function mesesDeGasto(hastaYM, cuantos, monto){
  const out=[];
  for(let i=1;i<=cuantos;i++) out.push(g("Varios","Supermercado",null,addMonths(hastaYM,-i)+"-10",monto));
  return out;
}

// Corre fn con estos movimientos y sin ningún candidato descartado, y después deja todo como
// estaba (la lista de descartados vive en localStorage).
function conMovsLimpios(lista, fn){
  const antes=movs;
  const antesIgnorados=localStorage.getItem("fcambioignorados");
  movs=lista;
  localStorage.removeItem("fcambioignorados");
  try { return fn(); }
  finally {
    movs=antes;
    if(antesIgnorados===null) localStorage.removeItem("fcambioignorados");
    else localStorage.setItem("fcambioignorados", antesIgnorados);
  }
}

// ── CÓMO SE VE EN LA LISTA DE MOVIMIENTOS ──
// El pedido concreto: que la pata en pesos se lea como un gasto y la pata en dólares como un
// ingreso. Se prueba sobre el HTML que arma la fila, que es lo que define el color y el signo.

// Corre fn con estos movimientos cargados en el global (construirCuerpoTxItem busca la pata
// hermana en `movs` para calcular el tipo de cambio) y después deja todo como estaba.
function conMovsGlobales(lista, fn){
  const antes=movs;
  movs=lista;
  try { return fn(); } finally { movs=antes; }
}

    const sale=construirCuerpoTxItem(patas[0]);
    const entra=construirCuerpoTxItem(patas[1]);
    cierto(/tx-amount gasto/.test(sale), "los pesos que salen tienen que leerse como un gasto");
    cierto(sale.includes("-$1.500"), "y con signo negativo: "+sale.slice(0,200));
    cierto(/tx-amount ingreso/.test(entra), "los dólares que entran tienen que leerse como un ingreso");
    cierto(entra.includes("+USD 1,00"), "y con signo positivo: "+entra.slice(0,200));
  });
});

// Corre renderMovs() de verdad con estos movimientos y devuelve las fechas de las filas, en el
// orden en que quedaron. Hace falta un #tx-list real: el getElementById parcheado de esta
// página devuelve un <div> descartable distinto en cada llamada.
function fechasDeLaLista(lista, filtroTipo){
  const cont=document.createElement("div");
  cont.id="tx-list"; cont.style.display="none";
  document.body.appendChild(cont);
  const antesMovs=movs, antesFiltro=filtro, antesMes=mesActual,
        antesCat=filtroCategoria, antesBusq=searchQuery, antesFecha=filtroFecha;
  try{
    movs=lista; filtro=filtroTipo; mesActual="2026-09";
    filtroCategoria=""; searchQuery=""; filtroFecha=null;
    renderMovs();
    // El data-key del placeholder es "id|tipo|fecha" — sirve para leer el orden sin depender
    // de que el custom element se haya "upgradeado".
    return [...cont.querySelectorAll("tx-item")].map(e=>String(e.dataset.key).split("|")[2]);
  } finally {
    movs=antesMovs; filtro=antesFiltro; mesActual=antesMes;
    filtroCategoria=antesCat; searchQuery=antesBusq; filtroFecha=antesFecha;
    cont.remove();
  }
}

grupo("Guardado: disco lleno");

// Cuando el almacenamiento se llena, localStorage.setItem() tira QuotaExceededError. Antes
// eso dejaba el cambio SOLO en memoria: se veía en la lista como guardado y al recargar no
// estaba. La plata se perdía sin que nada lo dijera.

// Corre fn con el disco "lleno" y los diálogos y el backup mockeados, y después deja todo
// como estaba. Devuelve qué se le preguntó al usuario.
function conDiscoLleno(fn, opts){
  const o=opts||{};
  const setReal=localStorage.setItem.bind(localStorage);
  const confirmReal=window.mostrarConfirm, alertaReal=window.mostrarAlerta,
        exportReal=window.exportarBackup, ultimoReal=ultimoGuardadoOk;
  const visto={preguntas:[], backupsBajados:0};
  localStorage.setItem=()=>{ const e=new Error("sin espacio"); e.name="QuotaExceededError"; throw e; };
  window.mostrarConfirm=(msg)=>{ visto.preguntas.push(msg); return Promise.resolve(!!o.bajaBackup); };
  window.mostrarAlerta=(msg)=>{ visto.preguntas.push(msg); return Promise.resolve(); };
  window.exportarBackup=()=>{ visto.backupsBajados++; };
  try { fn(visto); return visto; }
  finally {
    localStorage.setItem=setReal;
    window.mostrarConfirm=confirmReal; window.mostrarAlerta=alertaReal;
    window.exportarBackup=exportReal; ultimoGuardadoOk=ultimoReal;
  }
}

});

});

  // save() escribe 4 claves. Si revienta en la segunda, la primera ya quedó con datos nuevos
  // que no se corresponden con el resto: un movimiento guardado con su tarjeta perdida.
  const antesMovs=movs, antesTcs=tcs, antesUltimo=ultimoGuardadoOk;
  try{
    movs=[{id:1, tipo:"Gasto", nota:"Original", cat:"Otros", subcat:"", fecha:"2026-09-01",
           moneda:"ARS", importe:100, importeOrig:null}];
    tcs=[];
    save();                                  // foto buena en disco
    const enDiscoAntes=localStorage.getItem("fmovs3");

    const setReal=localStorage.setItem.bind(localStorage);
    let escrituras=0;
    // Falla recién en la SEGUNDA clave: la primera ya se escribió.

// Corre fn sin ninguna serie guardada y después deja lo que hubiera.
function sinSerieGuardada(fn){
  const antes=localStorage.getItem("finflacion");
  localStorage.removeItem("finflacion");
  try { return fn(); }
  finally { if(antes===null) localStorage.removeItem("finflacion"); else localStorage.setItem("finflacion", antes); }
}

// Genera meses seguidos desde ym, para tener una serie que pase el mínimo de 12.
function serieSeguida(ymDesde, cuantos, valor){
  const out=[];
  for(let i=0;i<cuantos;i++) out.push({fecha:addMonths(ymDesde,i)+"-28", valor:valor});
  return out;
}

grupo("Versión: aviso de app vieja");

// El service worker pide index.html SIEMPRE a la red, pero sirve los .js primero desde
// caché. Por eso podías terminar con HTML nuevo y JavaScript viejo sin ningún indicio — y
// eso hace parecer que otros arreglos no funcionan. El aviso compara la versión que el HTML
// fresco dice esperar contra la que reporta el service worker instalado.

test("la versión del HTML y la del service worker coinciden", async ()=>{
  // ESTE es el test que importa: el aviso funciona comparando dos números que hay que subir
  // juntos a mano. Si se desincronizan, el cartel aparece siempre y deja de significar nada
  // — un aviso que salta sin motivo se ignora y es peor que no tenerlo.
  const html=await (await fetch("index.html")).text();
  const sw=await (await fetch("sw.js")).text();
  const enHtml=(html.match(/<meta name="enola-version" content="([^"]+)"/)||[])[1];
  const enSw=(sw.match(/CACHE_VERSION\s*=\s*"([^"]+)"/)||[])[1];
  cierto(!!enHtml, "falta el <meta name=\"enola-version\"> en index.html");
  cierto(!!enSw, "no encontré CACHE_VERSION en sw.js");
  igual(enHtml, enSw, "subiste una y te olvidaste de la otra");
});

// El HTML se baja siempre fresco pero el CSS y los .js salen de la caché (cache-first): con un service worker viejo
// activo, podían quedar debajo de un HTML ya nuevo y la pantalla se veía sin estilos o con código viejo. Ahora el HTML
// pide cada archivo con ?v=<versión>: un archivo nuevo es otra URL y no puede salir de la caché vieja.
async function archivosDelHTML(){
  const html=await (await fetch("index.html")).text();
  const css=[...html.matchAll(/<link rel="stylesheet" href="(styles\.css[^"]*)"/g)].map(m=>m[1]);
  const js=[...html.matchAll(/<script src="(js\/[^"]+)"/g)].map(m=>m[1]);
  return {html, css, js, version:(html.match(/<meta name="enola-version" content="enola-v(\d+)"/)||[])[1]};
}

test("index.html pide el CSS y cada .js con la versión actual en la URL", async ()=>{
  const {css, js, version}=await archivosDelHTML();
  cierto(!!version, "no encontré la versión en el meta");
  igual(css.length, 1, "tiene que haber un solo stylesheet");
  cierto(js.length>=20, "esperaba todos los scripts de la app, hay "+js.length);
  [...css, ...js].forEach(u=>igual((u.match(/\?v=(\d+)$/)||[])[1], version, `${u} no lleva ?v=${version}: puede salir de una caché vieja`));
});

test("el service worker precachea exactamente las URLs con versión que pide el HTML", async ()=>{
  const {css, js, version}=await archivosDelHTML();
  const sw=await (await fetch("sw.js")).text();
  const cabecera=sw.slice(sw.indexOf("const VERSION_NUM"), sw.indexOf("];", sw.indexOf("const ASSETS"))+2);
  const lista=new Function("CACHE_VERSION", cabecera+"; return ASSETS.map(conVersion);")("enola-v"+version);
  const norm=u=>u.replace(/^\.\//,"");
  [...css, ...js].forEach(u=>cierto(lista.map(norm).includes(u), `el service worker no precachea ${u}`));
  cierto(lista.some(u=>norm(u)==="index.html"), "index.html se cachea sin versión (se pide siempre fresco)");
  cierto(lista.filter(u=>/\.(js|css)\?v=/.test(u)).length===css.length+js.length, "el service worker precachea archivos de más o de menos");
  cierto(sw.includes("ASSETS.map(conVersion)"), "el install no usa las URLs con versión");
});

test("el chequeo vive inline en el HTML, no en un archivo .js", async ()=>{

  const html=await (await fetch("index.html")).text();
  cierto(html.includes('meta[name="enola-version"]'),

  for(const archivo of ["js/main.js","js/config-ui.js","js/render-comun.js"]){
    const js=await (await fetch(archivo)).text();
    cierto(!js.includes('meta[name="enola-version"]'),

  }
});

// Helper: pone el DOM mínimo de la tarjeta de ahorros, corre renderAhorroChart() con una vista

function vistaAhorro(view, datos){

  const creados=ids.map(id=>{
    const el=document.createElement(id==="chart-fondo"?"canvas":"div");

  });
  const previo={view:ahorroState.view, dep:ahorroState.depositos, ret:ahorroState.retiros, arr:ahorroState.ahorrosArr};
  ahorroState.view=view;
  ahorroState.depositos=datos.depositos; ahorroState.retiros=datos.retiros;
  ahorroState.ahorrosArr=datos.ahorrosArr||[];
  let r;
  try{
    renderAhorroChart();
    r={canvas:creados[0].style.display, ranking:creados[1].style.display,
       rankingHtml:creados[1].innerHTML, desc:creados[2].textContent};

    ahorroState.retiros=previo.ret; ahorroState.ahorrosArr=previo.arr;
  }
  return r;
}

// Con una categoría elegida, el chip tiene que ser la suma de LO QUE SE VE en la lista.
// El bug: la ganancia de inversión del mes (que es del mes entero, no de una categoría) se le
// sumaba a cualquier categoría filtrada. Con datos reales, agosto 2026: un único movimiento de
// Salario de $1.607.621,32 mostraba $1.655.232 — los $47.610 de más eran la ganancia del FCI.
function chipsDeMovs(lista, filtroTab, categoria, ym, devolverHTML){
  const ids=["mov-summary","mov-arrastre","mov-cat-filtro","mov-tarjeta-filtro","tx-list","mov-mes-label"];
  const creados=ids.map(id=>{ const d=document.createElement("div"); d.id=id; document.body.appendChild(d); return d; });
  // `filtro` se declara con let en estado-categorias.js, así que es global pero NO vive en
  // window: asignarle window.filtro no cambia nada (fue el primer intento y los chips salían
  // todos en $0, mostrando la vista "Todos").
  const prev={movs, filtro, cat:filtroCategoria, mes:mesActual, ff:filtroFecha};
  movs=lista; filtro=filtroTab; filtroCategoria=categoria||""; mesActual=ym||"2026-08"; filtroFecha=null;
  try{ renderMovs(); return devolverHTML ? creados[0].innerHTML : (creados[0].innerText || creados[0].textContent); }
  finally{
    creados.forEach(e=>e.remove());
    movs=prev.movs; filtro=prev.filtro; filtroCategoria=prev.cat; mesActual=prev.mes; filtroFecha=prev.ff;
  }
}

function chipsDeMovsHTML(lista, filtroTab, categoria, ym){
  return chipsDeMovs(lista, filtroTab, categoria, ym, true);
}

// Los chips de Ingresos, Gastos y Balance se llenan con animarNumero(), que arranca en $0 y va
// subiendo por requestAnimationFrame. Leerlos apenas renderiza da siempre $0 — hay que esperar a
// que la animación termine. Los chips por ticker no se animan, así que esos se leen directo.
async function chipsDeMovsAnimados(lista, filtroTab, categoria, ym){
  const ids=["mov-summary","mov-arrastre","mov-cat-filtro","mov-tarjeta-filtro","tx-list","mov-mes-label"];
  const creados=ids.map(id=>{ const d=document.createElement("div"); d.id=id; document.body.appendChild(d); return d; });
  const prev={movs, filtro, cat:filtroCategoria, mes:mesActual, ff:filtroFecha};
  movs=lista; filtro=filtroTab; filtroCategoria=categoria||""; mesActual=ym||"2026-08"; filtroFecha=null;
  try{
    renderMovs();
    await new Promise(r=>setTimeout(r, 900));   // la animación dura 700 ms
    return creados[0].innerText || creados[0].textContent;
  } finally {
    creados.forEach(e=>e.remove());
    movs=prev.movs; filtro=prev.filtro; filtroCategoria=prev.cat; mesActual=prev.mes; filtroFecha=prev.ff;
  }
}

// Arma el gráfico con un Chart falso que sólo guarda la config, y devuelve esa config.
// Hace falta un <canvas> de verdad en el DOM: el harness devuelve un <div> para los ids
// que no existen, y un div no tiene getContext().
function configDelGrafico(yearData){
  const canvas=document.createElement("canvas"); canvas.id="chart-mensual";
  const detalle=document.createElement("div"); detalle.id="dash-detail";
  document.body.appendChild(canvas); document.body.appendChild(detalle);
  let capturada=null;
  const ChartPrevio=window.Chart;
  window.Chart=function(ctx, config){ capturada=config; this.destroy=function(){}; };
  try{ renderChartMensualBI(yearData); }
  finally{
    window.Chart=ChartPrevio;
    canvas.remove(); detalle.remove();
    if(typeof chartMensualInstance!=="undefined") chartMensualInstance=null;
  }
  return capturada;
}

grupo("Estilos");

// El mismo badge estaba escrito inline 21 veces con 9 ortografías distintas (padding 1px 5px
// vs 1px 6px, radio 6px vs 8px, con y sin font-weight), así que se veía apenas distinto en
// cada pantalla. Ahora hay una sola clase; este test evita que vuelvan a multiplicarse.
// Este test antes comparaba contra una lista escrita a mano y por eso no detectó que
// .seccion-label-sep había desaparecido del CSS mientras 10 elementos la seguían usando:
// esos rótulos perdieron su margen sin que nada avisara. Ahora la lista se DERIVA del código,
// así que cubre cualquier clase, incluidas las que se agreguen después.
//
// Una clase se da por buena si pasa alguna de estas tres:
//   1. está en styles.css;
//   2. está en un <style> dentro del mismo archivo (el informe HTML que exporta la app lleva
//      su propia hoja de estilos y no usa la de la app);
//   3. el JS la usa como gancho (querySelector, classList, closest…), o sea que existe para
//      encontrar el elemento, no para pintarlo.
test("toda clase usada en el código existe en styles.css", async ()=>{
  const ESTADO=["active","open","show","hidden","selected","dragover"];
  const archivos=["index.html"].concat(
    ["estado-categorias","render-comun","form-cargar","movimientos","editar-movimiento",
     "tarjetas-inversiones","dashboard","ahorros","graficos-interactivos","importar-exportar",
     "cuentas-tarjetas-categorias","config-ui","presupuestos","seguridad-pin","main"]
    .map(a=>`js/${a}.js`));

  const textos={};
  for(const ruta of archivos) textos[ruta]=await (await fetch(ruta)).text();
  const css=await (await fetch("styles.css")).text();
  const enCss=new Set((css.match(/\.[A-Za-z][\w-]*/g)||[]).map(c=>c.slice(1)));

  // Ganchos: cualquier clase que el JS busque o toque por nombre.
  const ganchos=new Set();
  const todo=Object.values(textos).join("\n");
  for(const m of todo.matchAll(/(?:querySelector|querySelectorAll|closest|matches)\(\s*["'`]([^"'`]+)["'`]/g)){
    for(const c of (m[1].match(/\.[A-Za-z][\w-]*/g)||[])) ganchos.add(c.slice(1));
  }
  for(const m of todo.matchAll(/classList\.(?:add|remove|toggle|contains)\(\s*["'`]([\w-]+)["'`]/g)) ganchos.add(m[1]);

  const huerfanas=new Map();
  for(const ruta of archivos){
    const txt=textos[ruta];
    // Clases definidas en un <style> del propio archivo (el informe exportado)
    const locales=new Set();
    for(const bloque of txt.match(/<style>[\s\S]*?<\/style>/g)||[]){
      for(const c of bloque.match(/\.[A-Za-z][\w-]*/g)||[]) locales.add(c.slice(1));
    }
    for(const m of txt.matchAll(/class="([^"${}]*)"/g)){
      for(const c of m[1].split(/\s+/)){
        if(!c || ESTADO.includes(c) || enCss.has(c) || locales.has(c) || ganchos.has(c)) continue;
        if(!huerfanas.has(c)) huerfanas.set(c, ruta);
      }
    }
  }
  igual([...huerfanas].map(([c,r])=>`${c} (${r})`), [],
    "hay clases usadas que no están definidas en ningún lado: el estilo se pierde sin aviso");
});

// Arma un canvas de verdad, dibuja la curva de ahorros y devuelve lo que cambió al tocarla.
// dprForzado sirve para reproducir el celular: el bug del marcador solo aparecía con dpr > 1.
function taparEnLaCurva(dprForzado){
  const dprOriginal=Object.getOwnPropertyDescriptor(window,"devicePixelRatio");
  Object.defineProperty(window,"devicePixelRatio",{value:dprForzado,configurable:true});
  const canvas=document.createElement("canvas");
  canvas.style.width="320px";
  const tip=document.createElement("div");
  document.body.appendChild(canvas); document.body.appendChild(tip);
  try{
    limpiarSeleccionLinea();
    const meses=["2026-01","2026-02","2026-03","2026-04","2026-05","2026-06"];
    const valores=[100,250,220,400,380,520];
    const dibujar=()=>drawInteractiveLine(canvas,meses,valores,"#2d7a3a",tip,(ym,v)=>ym+": "+v);
    dibujar();
    const ctx=canvas.getContext("2d");
    const caja=canvas.getBoundingClientRect();
    // drawInteractiveLine ya arranca con el último mes seleccionado (ver handoff de Ahorros),
    // así que el primer dibujo ya trae su propio marcador en un punto CONOCIDO (el último, x=
    // padL+cw en px CSS). "antes" se captura ahí mismo, sin tocar nada.
    const antes=ctx.getImageData(0,0,canvas.width,canvas.height).data;
    canvas.onclick({clientX:caja.left+caja.width*0.7, clientY:caja.top+caja.height/2});
    const despues=ctx.getImageData(0,0,canvas.width,canvas.height).data;
    const cambiados=[];
    for(let i=0;i<antes.length;i+=4){
      if(antes[i]!==despues[i]||antes[i+1]!==despues[i+1]||antes[i+2]!==despues[i+2]||antes[i+3]!==despues[i+3]){
        cambiados.push({x:(i/4)%canvas.width, y:Math.floor((i/4)/canvas.width)});
      }
    }
    // El diff trae DOS guías: la del marcador por defecto (último mes), que desaparece, y la del
    // tap, que aparece. Antes de esta función solo había una (no existía selección por defecto),
    // así que se descarta la que ya se sabe de antemano dónde está —misma fórmula de padL/cw que
    // usa drawInteractiveLine— para que el resto del test (que busca "la" columna con más
    // cambios) vuelva a ver una sola, como siempre asumió.
    const padL=44, padR=12, W=320, cw=W-padL-padR;
    const guiaViejaX=Math.round((padL+cw)*dprForzado); // último punto = padL + cw*(n-1)/(n-1)
    const sinLaGuiaVieja=cambiados.filter(c=>Math.abs(c.x-guiaViejaX)>6*dprForzado);
    return {cambiados:sinLaGuiaVieja, detalle:tip.textContent.trim(), ancho:canvas.width, dpr:dprForzado};
  } finally {
    canvas.remove(); tip.remove();
    if(dprOriginal) Object.defineProperty(window,"devicePixelRatio",dprOriginal);
  }
}

function nombreAccesible(el){
  if(el.getAttribute("aria-label")) return true;
  if(el.getAttribute("aria-labelledby")) return true;

  const id=el.getAttribute("id");
  if(id && el.ownerDocument.querySelector(`label[for="${id}"]`)) return true;
  return false;
}

// Guarda y restaura las claves de backup en localStorage y el array movs, para no afectar
// otros tests ni dejar un aviso "pendiente" que dispare en medio de otra prueba.
async function conEstadoDeBackup(seed, fn){
  const claves=["fultimobackup","fultimoavisobackup"];
  const antes=Object.fromEntries(claves.map(k=>[k, localStorage.getItem(k)]));
  const movsAntes=movs;
  claves.forEach(k=>localStorage.removeItem(k));
  Object.entries(seed||{}).forEach(([k,v])=>localStorage.setItem(k,v));
  if("movs" in (seed||{})) movs=seed.movs;
  // await, no un simple "return fn()": si fn() es async, un try/finally sin awaitear
  // restaura el estado apenas fn() ARRANCA (en su primer await), no cuando termina.
  try { return await fn(); }
  finally {
    claves.forEach(k=>{ const v=antes[k]; if(v===null) localStorage.removeItem(k); else localStorage.setItem(k,v); });
    movs=movsAntes;
  }
}

// Simula la respuesta del diálogo en vez de abrirlo de verdad, para poder probar las dos
// ramas (aceptar / posponer) sin depender de un click real.
async function simularRespuestaAviso(seed, respuesta){
  return conEstadoDeBackup(seed, async ()=>{
    let sePidioBackup=false;
    const originalConfirm=window.mostrarConfirm, originalExportar=window.exportarBackup;
    window.mostrarConfirm=()=>Promise.resolve(respuesta);
    window.exportarBackup=()=>{ sePidioBackup=true; };
    try{ await avisarSiFaltaBackup(); }
    finally{ window.mostrarConfirm=originalConfirm; window.exportarBackup=originalExportar; }
    return {sePidioBackup, quedoRegistradoElAviso: diasDesde(localStorage.getItem("fultimoavisobackup"))===0};
  });
}

// Envío por el menú de compartir del celular (Drive, WhatsApp…) con caída a la descarga.
async function conCompartir(canShare, share, fn){
  const tenia={cs:Object.getOwnPropertyDescriptor(navigator,"canShare"), sh:Object.getOwnPropertyDescriptor(navigator,"share")};
  Object.defineProperty(navigator,"canShare",{value:canShare, configurable:true, writable:true});
  Object.defineProperty(navigator,"share",{value:share, configurable:true, writable:true});
  const exportReal=window.exportarBackup; let descargas=0;
  window.exportarBackup=()=>{ descargas++; };
  try{ return await conEstadoDeBackup({movs:[MOV_COPIA(1,"x")]}, ()=>fn(()=>descargas)); }
  finally{
    window.exportarBackup=exportReal;
    ["canShare","share"].forEach(k=>{ delete navigator[k]; });
    if(tenia.cs) Object.defineProperty(navigator,"canShare",tenia.cs);
    if(tenia.sh) Object.defineProperty(navigator,"share",tenia.sh);
  }
}

// Prepara los datos globales y la preferencia del día de vencimiento, y lo deja como estaba.
async function conVenc({movs:m, tcs:t, venc}, fn){
  const antes={movs, tcs, v:localStorage.getItem("fvenctc")};
  movs=m||[]; tcs=t||[];
  if(venc) localStorage.setItem("fvenctc", JSON.stringify(venc)); else localStorage.removeItem("fvenctc");
  try{ return await fn(); }
  finally{ movs=antes.movs; tcs=antes.tcs; if(antes.v===null) localStorage.removeItem("fvenctc"); else localStorage.setItem("fvenctc", antes.v); }
}

// ── Banco de cada tarjeta ──
async function conBancosTc(mapa, fn){
  const antes=localStorage.getItem(BANCOS_TC_KEY);
  if(mapa) localStorage.setItem(BANCOS_TC_KEY, JSON.stringify(mapa)); else localStorage.removeItem(BANCOS_TC_KEY);
  try{ return await fn(); }
  finally{ if(antes===null) localStorage.removeItem(BANCOS_TC_KEY); else localStorage.setItem(BANCOS_TC_KEY, antes); }
}

async function conPapelera(fn){
  const antes={movs, tcs, metas, papelera, save:window.save, toast:window.showToast, confirm:window.mostrarConfirm, k:localStorage.getItem(PAPELERA_KEY), refrescar:window.refrescarVistas};
  let toastEl=document.querySelector("#toast"), creado=false;   // (el getElementById de esta página devuelve un div suelto si no existe)
  if(!toastEl){ toastEl=document.createElement("div"); toastEl.id="toast"; document.body.appendChild(toastEl); creado=true; }
  const ctx={guardados:0};
  window.save=()=>{ ctx.guardados++; return true; }; window.refrescarVistas=()=>{};
  papelera=[];
  try{ return await fn(ctx, toastEl); }
  finally{
    movs=antes.movs; tcs=antes.tcs; metas=antes.metas; papelera=antes.papelera; window.save=antes.save; window.showToast=antes.toast; window.mostrarConfirm=antes.confirm; window.refrescarVistas=antes.refrescar;
    if(antes.k===null) localStorage.removeItem(PAPELERA_KEY); else localStorage.setItem(PAPELERA_KEY, antes.k);
    toastEl.classList.remove("show","con-accion"); if(creado) toastEl.remove();
  }
}

  MES_C(20,"Gasto","Super",100000,"2026-08-10"), MES_C(21,"Gasto","Casa",100000,"2026-08-12"),

async function conHuellaFalsa({prf=true, resultadoEnCrear=true, cancela=false, plataforma=true}, fn){
  const secreto=new Uint8Array(32).map((_,i)=>i*7+1);
  const llamadas={crear:0, pedir:0, ext:null};
  const falsa={
    create:async(o)=>{ llamadas.crear++; if(cancela){ const e=new Error("x"); e.name="NotAllowedError"; throw e; }
      llamadas.ext=o.publicKey.extensions;
      return {rawId:new Uint8Array([9,8,7,6]).buffer, getClientExtensionResults:()=>prf ? {prf:{enabled:true, ...(resultadoEnCrear?{results:{first:secreto.buffer}}:{})}} : {}}; },
    get:async(o)=>{ llamadas.pedir++; if(cancela){ const e=new Error("x"); e.name="NotAllowedError"; throw e; }
      return {getClientExtensionResults:()=>({prf:{results:{first:secreto.buffer}}})}; }
  };
  const credAntes=Object.getOwnPropertyDescriptor(navigator,"credentials"), pkAntes=Object.getOwnPropertyDescriptor(window,"PublicKeyCredential");
  Object.defineProperty(navigator,"credentials",{value:falsa, configurable:true});
  Object.defineProperty(window,"PublicKeyCredential",{value:{isUserVerifyingPlatformAuthenticatorAvailable:async()=>plataforma}, configurable:true});
  const antes={confirm:window.mostrarConfirm, prompt:window.mostrarPrompt, alerta:window.mostrarAlerta, toast:window.showToast, hash:localStorage.getItem("fpinhash"), h:localStorage.getItem(HUELLA_KEY)};
  const ctx={alertas:[], toasts:[], llamadas, secreto, pinTipeado:"1234"};
  window.showToast=t=>ctx.toasts.push(t); window.mostrarAlerta=async m=>{ ctx.alertas.push(m); }; window.mostrarPrompt=async()=>ctx.pinTipeado;
  localStorage.setItem("fpinhash", await hashPin("1234")); localStorage.removeItem(HUELLA_KEY);
  try{ return await fn(ctx); }
  finally{
    if(credAntes) Object.defineProperty(navigator,"credentials",credAntes); else delete navigator.credentials;
    if(pkAntes) Object.defineProperty(window,"PublicKeyCredential",pkAntes); else delete window.PublicKeyCredential;
    window.mostrarPrompt=antes.prompt; window.mostrarAlerta=antes.alerta; window.showToast=antes.toast;
    if(antes.hash===null) localStorage.removeItem("fpinhash"); else localStorage.setItem("fpinhash", antes.hash);
    if(antes.h===null) localStorage.removeItem(HUELLA_KEY); else localStorage.setItem(HUELLA_KEY, antes.h);
  }
}

// El alta de un Gasto o Ingreso deja elegir Moneda, agregar una categoría al vuelo ("+ Cat.")
// y usar los atajos de fecha (Hoy/Ayer/-2d/-7d). El modal de EDICIÓN no tenía ninguno de los
// tres para un movimiento normal — solo la variante frecuente tenía selector de moneda.
//
// El más grave de los tres: sin selector de moneda, guardarEdit() igual escribía el número en
// `importe` sin tocar `importeOrig` ni `moneda`. Reproducido en la app real antes de este
// cambio: abrir un gasto en USD 54,21 y tocar "Guardar cambios" SIN CAMBIAR NADA dejaba el
// registro con importe=54.21 e importeOrig=54.21 a la vez, moneda="USD" — el mismo monto en
// las dos monedas.
//
// Se clona cada movimiento antes de usarlo: guardarEdit() muta el objeto en el lugar, y estas
// son const compartidas por todos los tests del grupo.
function abrirEdicion(mov){
  const clon={...mov};
  const ids=["modal-edit","edit-form-content"];
  const creados=ids.map(id=>{ const d=document.createElement("div"); d.id=id; document.body.appendChild(d); return d; });
  const movsAntes=movs, editingIdAntes=editingId;
  movs=[clon];
  openEditModal(clon.id);
  return {
    mov: clon,
    cerrar(){
      closeEditModal();
      creados.forEach(e=>e.remove());
      movs=movsAntes; editingId=editingIdAntes;
    }
  };
}

grupo("Menú lateral con íconos consistentes");

// Antes eran símbolos geométricos finos (≡ ▣ ◈ ◎ ⬆ ⚙) mezclados con un solo emoji real
// (🏦 Ahorros): el menú era el único lugar de la app con otro idioma visual. El resto —
// categorías, chips, títulos de card— es emoji de punta a punta (ver ICON_CHOICES en
// estado-categorias.js). Tarjetas e Inversiones reutilizan 💳 y 📈, que ya son sus íconos en
// otras pantallas (Cuentas, Inflación, la vista Acumulado de Ahorros).
function menuLateral(html){
  const ini=html.indexOf('<div id="side-menu">');
  const fin=html.indexOf("<!-- FAB de acceso rápido", ini);
  cierto(ini>=0 && fin>ini, "no se encontró el bloque completo del menú lateral");
  return html.slice(ini, fin);
}

});

// Las casillas del alta ("Es un ahorro", "Sale de mis ahorros", "Es un traspaso", "Gasto
// frecuente" x2, "Monto recuperable", y las dos de Cambio) son switches: toda la fila
// (ícono + texto) es su <label class="opt-row">, así que tocar en cualquier parte alterna el
// estado. El color (--chk) se define en ese <label> que envuelve la fila, no en el <input>
// suelto — como es una custom property de CSS, se hereda igual hacia el switch.
function checkboxesDeAlta(html){
  return [...html.matchAll(/<input type="checkbox" id="([\w-]+)"([^>]*)>/g)].map(m=>({id:m[1], attrs:m[2], index:m.index}));
}

test("ninguna casilla quedó con el estilo nativo del navegador", async ()=>{
  const html=await (await fetch("index.html")).text();
  const cajas=checkboxesDeAlta(html);
  igual(cajas.length, 14, "esperaba las 14 casillas conocidas (frec-ingreso, ahorro, usa-ahorro, traspaso, frecuente, recuperable, inv-mep, inv-sale-ahorro, cal-generico, tc-frecuente, cambio-ahorro, cambio-usaahorro, fechas-tc-repetir, drive-bk-on): " +
    cajas.map(c=>c.id).join(", "));
  cajas.forEach(({id, attrs, index})=>{
    cierto(attrs.includes('class="chk-custom"'), `${id} no usa la clase nueva: ${attrs}`);
    cierto(!attrs.includes("accent-color"), `${id} quedó con el recoloreo nativo en vez de la clase: ${attrs}`);
    const entorno=html.slice(Math.max(0,index-400), index);
    cierto(/--chk:\s*var\(--(save|accent|warning)\)/.test(entorno), `${id} no define su color por --chk en la fila (label.opt-row) que lo envuelve`);
  });
});

// Antes el recuadro de arriba del gráfico ("mes · ingresos · gastos · balance") arrancaba
// siempre con "Tocá un mes para ver el detalle", y se quedaba así hasta que alguien tocaba
// una barra — que en la práctica era la única pieza en blanco de toda la pantalla, porque casi
// nadie toca. Ahora se llena solo con el último mes del año elegido apenas se dibuja el
// gráfico, con la MISMA función que usa el clic, para que no puedan mostrar cosas distintas.
function conGraficoEnDOM(yearData, fn){
  const canvas=document.createElement("canvas"); canvas.id="chart-mensual";
  const detalle=document.createElement("div"); detalle.id="dash-detail";
  detalle.innerHTML="Tocá un mes para ver el detalle"; // el estado con el que arranca de verdad
  document.body.appendChild(canvas); document.body.appendChild(detalle);
  const ChartPrevio=window.Chart;
  window.Chart=function(ctx, config){ this.destroy=function(){}; };
  try{ renderChartMensualBI(yearData); return fn(detalle); }
  finally{
    window.Chart=ChartPrevio; canvas.remove(); detalle.remove();
    if(typeof chartMensualInstance!=="undefined") chartMensualInstance=null;
  }
}

// Con ticker, fecha, categoría, subcategoría e importe iguales a la vez, la chance de que
// sean dos operaciones reales y distintas es prácticamente cero. Es el patrón que deja subir
// el mismo archivo dos veces, o cargar a mano algo que ya estaba importado.
function invMov(id, ticker, fecha, importe, extra){
  return Object.assign({id, tipo:"Inversion", cat:"CEDEARs", subcat:"CEDEARs Compra",
                        ticker, fecha, importe, importeUSD:0}, extra||{});
}

grupo("Freno de doble toque al guardar");

// Dos toques rápidos sobre "Guardar" —común en un botón que tarda un instante en responder,
// o simplemente por costumbre— alcanzaban para crear dos movimientos IDÉNTICOS: es
// probablemente el origen real de los duplicados que aparecen en Inversiones, sin que haga
// falta ni un PDF. Se prueba reemplazando guardarSinFreno() por un espía que cuenta cuántas
// veces lo llama guardar() de verdad, en vez de armar el formulario completo con sus veinte
// campos — lo que cambió es el freno, no lo que se guarda.
function conGuardarSinFrenoFalso(){
  const original=guardarSinFreno;
  const llamadas=[];
  let resolver;
  guardarSinFreno=function(){
    llamadas.push(1);
    return new Promise(r=>{ resolver=r; });
  };
  return {
    llamadas,
    liberar:()=>resolver && resolver(),
    restaurar:()=>{ guardarSinFreno=original; }
  };
}

test("un segundo toque mientras se está guardando no dispara otro guardado", async ()=>{
  const {llamadas, liberar, restaurar}=conGuardarSinFrenoFalso();
  const btn=document.createElement("button"); btn.id="btn-guardar";
  document.body.appendChild(btn);
  try{
    const p1=guardar();   // primer toque: arranca, pero el mock no resuelve todavía
    igual(llamadas.length, 1, "el primer toque tiene que guardar");
    cierto(btn.disabled, "el botón tiene que verse deshabilitado mientras se guarda");
    const p2=guardar();   // segundo toque, con el primero todavía en curso
    igual(llamadas.length, 1, "el segundo toque no puede volver a ejecutar el guardado");
    liberar();
    await p1; await p2;
    cierto(!btn.disabled, "al terminar, el botón tiene que volver a habilitarse");
  } finally { btn.remove(); restaurar(); }
});

test("terminado un guardado, el siguiente toque sí guarda el suyo", async ()=>{
  const {llamadas, liberar, restaurar}=conGuardarSinFrenoFalso();
  const btn=document.createElement("button"); btn.id="btn-guardar";
  document.body.appendChild(btn);
  try{
    // liberar() recién tiene algo que resolver DESPUÉS de llamar a guardar(): es guardar()
    // el que crea la promesa pendiente, al invocar (el mock de) guardarSinFreno() por dentro.
    const p1=guardar(); liberar(); await p1;
    const p2=guardar(); liberar(); await p2;
    igual(llamadas.length, 2, "sin nada en curso, cada toque tiene que guardar el suyo");
  } finally { btn.remove(); restaurar(); }
});

test("el freno no depende de que el botón exista en el DOM", async ()=>{
  // El harness de tests devuelve un <div> descartable para ids que no existen: el guard en sí
  // (la variable `guardando`) no puede depender de #btn-guardar para funcionar.
  const {llamadas, liberar, restaurar}=conGuardarSinFrenoFalso();
  try{
    const p=guardar(); liberar(); await p;
    igual(llamadas.length, 1, "sin el botón en el DOM, guardar() no puede fallar en silencio");
  } finally { restaurar(); }
});

// Bug reportado: en un mes viejo con muchos movimientos (lista cargada por lotes, ver "LAZY

// desde el primer lote y deja al usuario "colgado" arriba de un centinela nuevo que no vuelve

function conModalTc(t, fn){
  const ids=["modal-edit","edit-form-content"];
  const creados=ids.map(id=>{ const d=document.createElement("div"); d.id=id; document.body.appendChild(d); return d; });
  const antes=tcs, render=renderTarjetas;

  try { return fn(); } finally { try{ closeEditModal(); }catch(e){} creados.forEach(e=>e.remove()); tcs=antes; renderTarjetas=render; }
}

async function conAviso(valor, fn){
  const antes=localStorage.getItem("fvencaviso");
  if(valor===null) localStorage.removeItem("fvencaviso"); else localStorage.setItem("fvencaviso", String(valor));

}

function conCalendario({canShare, share}, fn){
  const tenia={cs:Object.getOwnPropertyDescriptor(navigator,"canShare"), sh:Object.getOwnPropertyDescriptor(navigator,"share")};
  Object.defineProperty(navigator,"canShare",{value:canShare, configurable:true, writable:true});
  Object.defineProperty(navigator,"share",{value:share, configurable:true, writable:true});
  const clickReal=HTMLAnchorElement.prototype.click; let descargas=0;
  HTMLAnchorElement.prototype.click=function(){ descargas++; };
  return Promise.resolve().then(()=>conVenc({movs:[FREC_VTO(1,5)]}, ()=>fn(()=>descargas))).finally(()=>{
    HTMLAnchorElement.prototype.click=clickReal;
    ["canShare","share"].forEach(k=>{ delete navigator[k]; });
    if(tenia.cs) Object.defineProperty(navigator,"canShare",tenia.cs);
    if(tenia.sh) Object.defineProperty(navigator,"share",tenia.sh);
  });
}

grupo("Google Calendar");

const CLAVES_GCAL=["fgcalid","fgcalon","fgcalmapa","fgcaltok","fgcalultima","fvencaviso"];
async function conGcal(fn, {conectado=true, token=true}={}){
  const antes=CLAVES_GCAL.map(k=>localStorage.getItem(k));
  CLAVES_GCAL.forEach(k=>localStorage.removeItem(k));
  if(conectado){ localStorage.setItem("fgcalid","123-abc.apps.googleusercontent.com"); localStorage.setItem("fgcalon","1"); }
  if(token) localStorage.setItem("fgcaltok", JSON.stringify({t:"tok", exp:Date.now()+3600000}));
  try{ return await fn(); }
  finally{ CLAVES_GCAL.forEach((k,i)=>{ if(antes[i]===null) localStorage.removeItem(k); else localStorage.setItem(k, antes[i]); }); }
}
// Un Google Calendar de mentira: guarda los eventos, contesta como la API y anota las llamadas.
function servidorGcal(forzar){
  const eventos=new Map(); let n=0; const llamadas=[];
  const resp=(status,json)=>({status, json:async()=>json});
  const fetchFalso=async (url, init)=>{
    const m=(init&&init.method)||"GET"; const u=new URL(url);
    const ruta=u.pathname.replace("/calendar/v3","");
    llamadas.push(m+" "+ruta);
    if(forzar) return resp(forzar, {error:{message:"forzado"}});
    if(m==="GET"){
      const q=u.searchParams.get("privateExtendedProperty");
      return resp(200,{items:[...eventos.values()].filter(e=>"enola="+e.extendedProperties.private.enola===q)});
    }
    if(m==="POST"){ const id="ev"+(++n); const e={...JSON.parse(init.body), id}; eventos.set(id,e); return resp(200,e); }
    const id=decodeURIComponent(ruta.split("/").pop());
    if(m==="PATCH"){ if(!eventos.has(id)) return resp(404,{}); const e={...eventos.get(id), ...JSON.parse(init.body)}; eventos.set(id,e); return resp(200,e); }
    if(m==="DELETE"){ if(!eventos.has(id)) return resp(410,{}); eventos.delete(id); return resp(204,null); }
  };
  return {deps:{token:async()=>"tok", fetch:fetchFalso}, eventos, llamadas, soloEscrituras:()=>llamadas.filter(l=>!l.startsWith("GET"))};
}

const CLAVES_DRIVE=["fdrivebk","fdrivecarpeta","fdriveult"];
async function conDrive(fn, {activo=true, token=true}={}){
  const antes=[...CLAVES_GCAL, ...CLAVES_DRIVE].map(k=>localStorage.getItem(k));
  [...CLAVES_GCAL, ...CLAVES_DRIVE].forEach(k=>localStorage.removeItem(k));
  localStorage.setItem("fgcalid","123-abc.apps.googleusercontent.com"); localStorage.setItem("fgcalon","1");
  if(activo) localStorage.setItem("fdrivebk","1");
  if(token) localStorage.setItem("fgcaltok", JSON.stringify({t:"tok", exp:Date.now()+3600000, s:GCAL_SCOPE+" "+DRIVE_SCOPE}));
  try{ return await fn(); }
  finally{ [...CLAVES_GCAL, ...CLAVES_DRIVE].forEach((k,i)=>{ if(antes[i]===null) localStorage.removeItem(k); else localStorage.setItem(k, antes[i]); }); }
}
const MOVS_DRIVE=()=>[{id:1,tipo:"Gasto",cat:"Super",moneda:"ARS",importe:100,fecha:"2026-10-01"},{id:2,tipo:"Ingreso",cat:"Sueldo",moneda:"ARS",importe:900,fecha:"2026-10-02"}];

// Un Google Drive de mentira: carpetas y archivos en memoria, con las mismas rutas y respuestas que la API real.
function servidorDrive(forzar){
  const archivos=new Map(); let n=0; const llamadas=[];
  const resp=(status,obj)=>({status, text:async()=>obj===undefined ? "" : (typeof obj==="string" ? obj : JSON.stringify(obj))});
  const fetchFalso=async (url, init)=>{
    const m=(init&&init.method)||"GET"; const u=new URL(url); const ruta=u.pathname;
    llamadas.push(m+" "+ruta.replace("/upload/drive/v3","UP").replace("/drive/v3",""));
    if(forzar) return resp(forzar,{error:{message:"forzado"}});
    const q=u.searchParams.get("q")||"";
    if(ruta==="/drive/v3/files" && m==="GET"){
      let lista=[...archivos.values()].filter(f=>!f.trashed);
      if(q.includes("mimeType='application/vnd.google-apps.folder'")) lista=lista.filter(f=>f.mimeType==="application/vnd.google-apps.folder" && q.includes("name='"+f.name+"'"));
      else{
        const mp=/'([^']+)' in parents/.exec(q); if(mp) lista=lista.filter(f=>f.parents && f.parents.includes(mp[1]));
        const mn=/name='([^']+)'/.exec(q); if(mn) lista=lista.filter(f=>f.name===mn[1]);
      }
      return resp(200,{files:lista.map(f=>({id:f.id, name:f.name, size:String((f.contenido||"").length)}))});
    }
    if(ruta==="/drive/v3/files" && m==="POST"){ const b=JSON.parse(init.body); const id="d"+(++n); archivos.set(id,{id, ...b}); return resp(200,{id}); }
    if(ruta==="/upload/drive/v3/files" && m==="POST"){
      const lim=/boundary=(\S+)/.exec(init.headers["Content-Type"])[1];
      const partes=init.body.split("--"+lim).filter(p=>p.trim() && p.trim()!=="--");
      const cuerpo=p=>p.slice(p.indexOf("\r\n\r\n")+4).replace(/\r\n$/,"");
      const id="d"+(++n); archivos.set(id,{id, ...JSON.parse(cuerpo(partes[0])), contenido:cuerpo(partes[1])});
      return resp(200,{id});
    }
    const mid=/\/files\/([^/?]+)$/.exec(ruta); const id=mid && decodeURIComponent(mid[1]);
    if(id){
      const f=archivos.get(id);
      if(!f) return resp(404,{});
      if(m==="GET") return u.searchParams.get("alt")==="media" ? resp(200,f.contenido) : resp(200,{id, trashed:!!f.trashed});
      if(m==="PATCH"){ f.contenido=init.body; return resp(200,{id}); }
      if(m==="DELETE"){ archivos.delete(id); return resp(204); }
    }
    return resp(400,{});
  };
  const carpeta=()=>[...archivos.values()].find(f=>f.mimeType==="application/vnd.google-apps.folder");
  const backups=()=>[...archivos.values()].filter(f=>RE_BACKUP_DRIVE.test(f.name||""));
  return {deps:{token:async()=>"tok", fetch:fetchFalso}, archivos, llamadas, carpeta, backups, agregar:(f)=>{ const id="d"+(++n); archivos.set(id,{id, ...f}); return id; }};
}

function conEditorMeta(fn){
  const els=[];
  const crear=(tag,id)=>{ const e=document.createElement(tag); e.id=id; document.body.appendChild(e); els.push(e); return e; };
  crear("div","modal-meta"); crear("div","meta-modal-title"); crear("div","btn-guardar-meta");
  crear("input","meta-nombre"); crear("input","meta-objetivo"); crear("input","meta-emoji"); crear("select","meta-fondo");
  const antes={metas, movs, render:renderMetas, editing:editingMetaId};
  renderMetas=()=>{};
  try{ return fn(); } finally{ metas=antes.metas; movs=antes.movs; renderMetas=antes.render; editingMetaId=antes.editing; els.forEach(e=>e.remove()); }
}

(async function correr(){
  const salida=document.querySelector("#salida");
  let ok=0, fail=0, ultimoGrupo="";
  for(const pr of pruebas){
    if(pr.grupo!==ultimoGrupo){
      ultimoGrupo=pr.grupo;
      const h=document.createElement("div");
      h.className="grupo"; h.textContent=ultimoGrupo;
      salida.appendChild(h);
    }
    const t0=performance.now();
    let error=null;
    try { await pr.fn(); } catch(e){ error=e; }
    const ms=Math.round(performance.now()-t0);
    const div=document.createElement("div");
    div.className="t "+(error?"fail":"ok");
    div.innerHTML=`<span class="ico">${error?"✕":"✓"}</span><div style="flex:1;min-width:0">${
      pr.nombre.replace(/[<>&]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;"}[c]))
    }${error?`<div class="detalle"></div>`:""}</div><span class="ms">${ms} ms</span>`;
    if(error) div.querySelector(".detalle").textContent=error.message;
    salida.appendChild(div);
    error?fail++:ok++;
  }
  const r=document.querySelector("#resumen");
  r.textContent=fail===0 ? `✓ Pasaron los ${ok} tests` : `✕ ${fail} fallaron · ${ok} pasaron`;
  r.style.color=fail===0?"#2d7a3a":"#a32d2d";
  window.__resultado={ok, fail};   // para poder correrlo automatizado
})();
</script>
